<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Frozen Mart · Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="brand/logo-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="https://frozenmart.bryanowusu.club/" target="_blank" rel="noopener">
        <img class="brand-img" src="brand/logo-horizontal.svg" alt="Frozen Mart" width="190" height="24">
        <span class="admin-tag">Admin</span>
      </a>
      <div class="a-top-actions">
        <a class="btn-ghost" href="https://frozenmart.bryanowusu.club/" target="_blank" rel="noopener">View shop ↗</a>
        <button class="btn-ghost" id="logout" hidden>Log out</button>
      </div>
    </div>
  </header>

  <!-- Login -->
  <main class="login-wrap" id="loginView">
    <form class="login-card" id="loginForm">
      <div class="login-ic">
        <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
      </div>
      <h1>Admin login</h1>
      <p>Enter your admin password to update stock, prices and photos.</p>
      <label>Password <input id="pw" type="password" autocomplete="current-password" required></label>
      <p class="form-error" id="loginError" hidden></p>
      <button class="a-btn" type="submit" id="loginBtn">Log in</button>
    </form>
  </main>

  <!-- Dashboard -->
  <main class="wrap a-main" id="appView" hidden>
    <div class="a-head">
      <div>
        <span class="kicker">Dashboard</span>
        <h1>Products &amp; stock</h1>
      </div>
      <div class="a-head-btns">
        <select class="a-pick" id="starterPick" aria-label="Add a product from your list" hidden></select>
        <button class="btn-ghost" id="starterBtn" title="Replace the whole list below with the products and prices from your flyer">Replace all with starting list</button>
        <button class="a-btn" id="addBtn">+ Add product</button>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <p class="note" id="sourceNote" hidden>
      These are your starting products. Check them, then press <strong>Save changes</strong> once to make this your live stock list.
    </p>

    <div class="a-search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Search products…" aria-label="Search products">
    </div>

    <datalist id="cats"></datalist>
    <div class="a-list" id="list"></div>
  </main>

  <div class="savebar" id="savebar" hidden>
    <div class="wrap savebar-inner">
      <span><span class="dot"></span> You have unsaved changes</span>
      <div class="savebar-btns">
        <button class="btn-ghost" id="discardBtn">Discard</button>
        <button class="a-btn" id="saveBtn">Save changes</button>
      </div>
    </div>
  </div>

  <input type="file" id="file" accept="image/*" multiple hidden>
  <div class="toast" id="toast" role="status"></div>

  <script src="products.js"></script>
  <script src="admin.js"></script>
</body>
</html>
